<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile | TECH 3498</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">

  <script src="theme.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-shield-check text-info me-2"></i>TECH 3498<span class="text-info">.sec</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="nav-link" href="index.html">Back to site</a>
        <button class="btn btn-outline-warning btn-sm theme-toggle-btn" type="button">
          <i class="bi bi-sun-fill me-1"></i>
          <span class="theme-label">Light Theme</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-5" style="padding-top: 130px !important;">
    <section id="access-denied" class="d-none text-center py-5">
      <div class="card feature-card p-5 mx-auto" style="max-width: 600px;">
        <i class="bi bi-person-lock text-warning display-4 mb-3"></i>
        <h1 class="h3 text-white">User account required</h1>
        <p class="text-secondary">Sign in with the regular user account to view this page.</p>
        <a href="login.html" class="btn btn-info">Go to Login</a>
      </div>
    </section>

    <section id="profile-page" class="d-none">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="sec-console-card p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="icon-box bg-info bg-opacity-10 text-info mx-auto mb-3"
                   style="width: 64px; height: 64px; font-size: 1.8rem;">
                <i class="bi bi-person-circle"></i>
              </div>
              <h1 class="h3 text-white fw-bold">Your Profile</h1>
              <p class="text-secondary mb-0">
                Signed in as <strong id="account-username" class="text-info"></strong>
              </p>
            </div>

            <div class="mb-4">
              <span class="text-secondary small">Your name</span>
              <p id="display-name" class="text-white fs-4 fw-semibold mb-0"></p>
            </div>

            <form id="name-form">
              <label for="name-input" class="form-label text-light">Change your name</label>
              <input
                id="name-input"
                class="form-control mb-3"
                type="text"
                maxlength="60"
                required
                autocomplete="name"
                placeholder="Enter your name">

              <button class="btn btn-info text-dark fw-bold w-100" type="submit">
                <i class="bi bi-check2 me-1"></i>Save name
              </button>
              <p id="save-message" class="text-success small mt-3 mb-0 d-none" role="status">
                Your name has been saved.
              </p>
            </form>

            <hr class="border-secondary my-4">

            <button id="logout-button" class="btn btn-outline-danger w-100" type="button">
              <i class="bi bi-box-arrow-left me-1"></i>Log out
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const username = sessionStorage.getItem("authUser") || "";
      const isRegularUser =
        sessionStorage.getItem("isLoggedIn") === "true" &&
        sessionStorage.getItem("authRole") === "user";

      const denied = document.getElementById("access-denied");
      const profile = document.getElementById("profile-page");

      if (!isRegularUser) {
        denied.classList.remove("d-none");
        return;
      }

      profile.classList.remove("d-none");

      const nameKey = `siteCyberProfileName:${username}`;
      const usernameDisplay = document.getElementById("account-username");
      const displayName = document.getElementById("display-name");
      const nameInput = document.getElementById("name-input");
      const saveMessage = document.getElementById("save-message");

      usernameDisplay.textContent = username;

      const savedName = localStorage.getItem(nameKey) || username;
      displayName.textContent = savedName;
      nameInput.value = savedName;

      document.getElementById("name-form").addEventListener("submit", event => {
        event.preventDefault();

        const newName = nameInput.value.trim();
        if (!newName) return;

        localStorage.setItem(nameKey, newName);
        displayName.textContent = newName;
        saveMessage.classList.remove("d-none");
      });

      document.getElementById("logout-button").addEventListener("click", () => {
        sessionStorage.removeItem("isLoggedIn");
        sessionStorage.removeItem("authUser");
        sessionStorage.removeItem("authRole");
        window.location.href = "login.html";
      });
    });
  </script>
</body>
</html>

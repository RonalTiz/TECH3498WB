<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Leaderboard | TECH 3498</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="../theme.js"></script>

  <style>
    .players-main { min-height: 70vh; padding-top: 120px; }

    .player-card {
      position: relative;
      isolation: isolate;
      min-height: 250px;
      overflow: hidden;
      color: white;
      background: linear-gradient(135deg, #164e63, #0f172a);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
    }

    .player-card > img {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(5, 10, 20, .92), rgba(5, 10, 20, .42));
    }

    .player-card-button {
      width: 100%;
      min-height: 250px;
      padding: 1.25rem;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
    }

    .player-rank {
      display: inline-grid;
      width: 2.5rem;
      height: 2.5rem;
      place-items: center;
      border-radius: 50%;
      color: #0b1120;
      background: #67e8f9;
      font-weight: 800;
    }

    .player-score { font-size: 1.7rem; font-weight: 800; }

    .player-details {
      padding: 1rem 1.25rem;
      color: var(--text-main);
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-top: 1px solid var(--border-color);
    }

    .deck-item {
      padding: .65rem .8rem;
      background: rgba(255, 255, 255, .06);
      border-radius: .6rem;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">ECCCommander</a>
      <div class="ms-auto d-flex gap-3">
        <a class="nav-link" href="index.html">Deck Leaderboard</a>
        <a id="auth-nav-link" class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="user.html">My Profile</a>
        <a id="admin-console-link" class="nav-link d-none"
           href="../Admin_section/security.html">Admin Console</a>
      </div>
    </div>
  </nav>

  <main class="container players-main pb-5">
    <header class="text-center mb-4">
      <p class="text-info fw-semibold text-uppercase mb-1">Game Records</p>
      <h1 class="text-white fw-bold">Player Leaderboard</h1>
      <p class="text-secondary">
        Score = (2 + number of opponents × wins + 1 × draws) / (wins + losses + draws)
      </p>
    </header>

    <div id="status" class="alert alert-info" role="status" aria-live="polite">
      Loading player leaderboard…
    </div>
    <p id="result-count" class="text-secondary small"></p>
    <section id="leaderboard" class="row g-3" aria-label="Player rankings"></section>
  </main>

  <script type="module">
    import { supabase } from "../supabase-client.js";

    const AVATAR_BUCKET = "avatars"; // Change to your profile-image bucket.
    const status = document.getElementById("status");
    const leaderboard = document.getElementById("leaderboard");
    const resultCount = document.getElementById("result-count");
    const authNavLink = document.getElementById("auth-nav-link");
    const adminConsoleLink = document.getElementById("admin-console-link");
    
    async function updateAdminLink(session) {
      adminConsoleLink.classList.add("d-none");
      if (!session?.user) return;
    
      const { data: isAdmin, error } =
        await supabase.rpc("is_current_user_admin");
    
      if (!error && isAdmin === true) {
        adminConsoleLink.classList.remove("d-none");
      }
    }

    let isSignedIn = false;

    function updateAuthLink(session) {
      isSignedIn = Boolean(session?.user);
      authNavLink.textContent = isSignedIn ? "Sign out" : "Login";
      authNavLink.href = "login.html";
    }

    const { data: { session } } = await supabase.auth.getSession();
    updateAuthLink(session);
    await updateAdminLink(session);

    supabase.auth.onAuthStateChange((_event, session) => {
      updateAuthLink(session);
      setTimeout(() => updateAdminLink(session), 0);
    });

    authNavLink.addEventListener("click", async event => {
      if (!isSignedIn) return;

      event.preventDefault();
      const { error } = await supabase.auth.signOut();

      if (error) {
        console.error("Sign-out failed:", error);
        window.alert("Could not sign out. Please try again.");
      }
    });

    async function fetchAll(makeQuery) {
      const rows = [];
      const pageSize = 1000;

      for (let offset = 0; ; offset += pageSize) {
        const { data, error } = await makeQuery().range(offset, offset + pageSize - 1);
        if (error) throw error;
        rows.push(...(data || []));
        if (!data || data.length < pageSize) return rows;
      }
    }

    function avatarUrl(path) {
      if (!path) return "";
      if (/^https?:\/\//i.test(path)) return path;
      return supabase.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    async function loadLeaderboard() {
      try {
        const [players, games] = await Promise.all([
          fetchAll(() => supabase.from("players")
            .select("id, display_name, user_id, player_score")
            .order("id")),
          fetchAll(() => supabase.from("games")
            .select("id, result, winner_player_id")
            .in("result", ["win", "draw"])
            .order("id"))
        ]);

        const gameIds = games.map(game => game.id);
        const participants = [];

        for (let i = 0; i < gameIds.length; i += 100) {
          const ids = gameIds.slice(i, i + 100);
          participants.push(...await fetchAll(() =>
            supabase.from("game_players")
              .select("game_id, player_id, deck_id")
              .in("game_id", ids)
              .order("game_id")
          ));
        }

        const gamesById = new Map(games.map(game => [game.id, game]));
        const playerStats = new Map();
        const deckUses = new Map();

        for (const participant of participants) {
          const game = gamesById.get(participant.game_id);
          if (!game) continue;
const stats = playerStats.get(participant.player_id) || {
  games: 0,
  wins: 0
};

stats.games++;
if (game.result === "win" &&
    game.winner_player_id === participant.player_id) {
  stats.wins++;
}

playerStats.set(participant.player_id, stats);


          if (participant.deck_id) {
            deckUses.set(participant.deck_id, (deckUses.get(participant.deck_id) || 0) + 1);
          }
        }

        const deckIds = [...deckUses.keys()];
        const decks = [];

        for (let i = 0; i < deckIds.length; i += 100) {
          const ids = deckIds.slice(i, i + 100);
          decks.push(...await fetchAll(() => supabase.from("decks")
            .select("id, name, player_id, commander_id")
            .in("id", ids)
            .order("id")));
        }

        const commanderIds = [...new Set(decks.map(deck => deck.commander_id).filter(Boolean))];
        const commanders = [];

        for (let i = 0; i < commanderIds.length; i += 100) {
          const ids = commanderIds.slice(i, i + 100);
          commanders.push(...await fetchAll(() => supabase.from("commanders")
            .select("id, name")
            .in("id", ids)
            .order("id")));
        }

        const commandersById = new Map(commanders.map(item => [item.id, item]));
        const decksByPlayer = new Map();

        for (const deck of decks) {
          if (!decksByPlayer.has(deck.player_id)) decksByPlayer.set(deck.player_id, []);
          decksByPlayer.get(deck.player_id).push({
            ...deck,
            uses: deckUses.get(deck.id) || 0,
            commanderName: commandersById.get(deck.commander_id)?.name
          });
        }

        const userIds = [...new Set(players.map(player => player.user_id).filter(Boolean))];
        let profiles = [];

        if (userIds.length) {
          try {
            for (let i = 0; i < userIds.length; i += 100) {
              const ids = userIds.slice(i, i + 100);
              const { data, error } = await supabase.from("profiles")
                .select("id, avatar_path")
                .in("id", ids);
              if (error) throw error;
              profiles.push(...(data || []));
            }
          } catch (error) {
            console.warn("Profile images could not be loaded:", error);
          }
        }

        const profilesById = new Map(profiles.map(profile => [profile.id, profile]));

        const rows = players.map(player => {
          const stats = playerStats.get(player.id) || {
            games: 0, wins: 0
          };
          return {
            ...player,
            ...stats,
            score: Number(player.player_score || 0),
            winRate: stats.games ? stats.wins / stats.games : 0,
            avatar: avatarUrl(profilesById.get(player.user_id)?.avatar_path),
            decks: (decksByPlayer.get(player.id) || [])
              .sort((a, b) => b.uses - a.uses || a.name.localeCompare(b.name))
              .slice(0, 3)
          };
        })
          .filter(player => player.score > 0)
          .sort((a, b) =>
            Number(b.player_score) - Number(a.player_score) ||
            b.winRate - a.winRate ||
            b.games - a.games
          );
          

        status.className = "alert d-none";
        resultCount.textContent = `${rows.length} ${rows.length === 1 ? "player" : "players"} ranked`;

        if (!rows.length) {
          status.className = "alert alert-secondary";
          status.textContent = "No completed player games found.";
          return;
        }

        rows.forEach((player, index) => {
          const column = document.createElement("div");
          column.className = "col-12 col-md-6";

          const card = document.createElement("article");
          card.className = "player-card";

          if (player.avatar) {
            const image = document.createElement("img");
            image.src = player.avatar;
            image.alt = "";
            image.loading = "lazy";
            card.appendChild(image);
          }

          const button = document.createElement("button");
          button.type = "button";
          button.className = "player-card-button";
          button.setAttribute("aria-expanded", "false");

          const heading = document.createElement("div");
          heading.className = "d-flex align-items-center gap-3 mb-3";

          const rank = document.createElement("span");
          rank.className = "player-rank";
          rank.textContent = String(index + 1);

          const name = document.createElement("h2");
          name.className = "h4 fw-bold mb-0 text-break";
          name.textContent = player.display_name;

          heading.append(rank, name);

          const score = document.createElement("div");
          score.className = "player-score";
          score.textContent = `Score: ${player.score.toFixed(2)}`;

          const stats = document.createElement("div");
          stats.className = "mt-2";
          stats.textContent =
            `${player.games} games played · ${(player.winRate * 100).toFixed(1)}% win rate`;

          const hint = document.createElement("small");
          hint.className = "d-block mt-3 opacity-75";
          hint.textContent = "Click to view top decks";

          button.append(heading, score, stats, hint);

          const details = document.createElement("div");
          details.className = "player-details d-none";

          const decksHeading = document.createElement("h3");
          decksHeading.className = "h6 fw-bold";
          decksHeading.textContent = "Most Played Commanders";
          details.appendChild(decksHeading);

          if (!player.decks.length) {
            const empty = document.createElement("p");
            empty.className = "small mb-0";
            empty.textContent = "No deck usage recorded.";
            details.appendChild(empty);
          } else {
            player.decks.forEach((deck, deckIndex) => {
              const item = document.createElement("div");
              item.className = "deck-item small mb-2";
              item.textContent =
                `${deckIndex + 1}. ${deck.name}` +
                (deck.commanderName ? ` — ${deck.commanderName}` : "") +
                ` · ${deck.uses} ${deck.uses === 1 ? "game" : "games"}`;
              details.appendChild(item);
            });
          }

          button.addEventListener("click", () => {
            const isOpen = !details.classList.contains("d-none");
            details.classList.toggle("d-none", isOpen);
            button.setAttribute("aria-expanded", String(!isOpen));
          });

          card.append(button, details);
          column.appendChild(card);
          leaderboard.appendChild(column);
        });
      } catch (error) {
        console.error("Could not load player leaderboard:", error);
        status.className = "alert alert-danger";
        status.textContent =
          "Could not load the leaderboard. Check public read permissions for players, games, game_players, decks, and commanders.";
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>

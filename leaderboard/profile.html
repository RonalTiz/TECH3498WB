<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public Profile | TECH 3498</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="../theme.js"></script>
  <style>
    .list-group-item {
      color: var(--text-main);
      background: var(--bg-subtle);
      border-color: var(--border-color);
    }
    
    .profile-stat-card {
      height: 100%;
      padding: 1rem;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
    }
    
    .commander-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 200px;
      color: white;
      background: linear-gradient(135deg, #164e63, #0f172a);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
    }
    
    .commander-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(5, 10, 20, .92), rgba(5, 10, 20, .42));
    }
    
    .commander-art-pair {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: flex;
      overflow: hidden;
    }
    
    .commander-art-pair img {
      width: 50%;
      height: 100%;
      object-fit: cover;
    }
    
    .commander-art-pair.single img {
      width: 100%;
    }
    
    .top-deck-content {
      position: relative;
      min-height: 200px;
      padding: 1.25rem;
    }
    
    .public-profile {
      margin-top: 130px;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
    }
    .profile-avatar {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--cyber-cyan);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">ECCCommander</a>
      <a class="nav-link" href="players.html">Player Leaderboard</a>
    </div>
  </nav>

  <main class="container pb-5">
    <section id="profile-card" class="public-profile p-4 p-md-5 mx-auto text-center"
             style="max-width: 700px;">
      <div id="profile-status" class="text-secondary" role="status">
        Loading profile…
      </div>
      <div id="profile-content" class="d-none">
        <img id="profile-avatar" class="profile-avatar mb-3" alt="">
        <h1 id="profile-name" class="h2 fw-bold"></h1>
        <p id="profile-description" class="text-secondary mb-0"></p>
      </div>
    </section>
    <div class="row g-3 mt-4 text-start">
      <div class="col-12">
        <section class="profile-stat-card" aria-labelledby="top-points-heading">
          <h2 id="top-points-heading" class="h5 mb-3">Top deck by points</h2>
          <article id="top-points-deck" class="commander-card">
            <div class="top-deck-content">Loading…</div>
          </article>
        </section>
      </div>
    
      <div class="col-12 col-lg-6">
        <section class="profile-stat-card" aria-labelledby="top-played-heading">
          <h2 id="top-played-heading" class="h5 mb-3">Most played decks</h2>
          <ol id="top-played-decks" class="list-group list-group-numbered"></ol>
        </section>
      </div>
    
      <div class="col-12 col-lg-6">
        <section class="profile-stat-card" aria-labelledby="player-stats-heading">
          <h2 id="player-stats-heading" class="h5 mb-3">Player stats</h2>
          <div>Total points: <strong id="profile-total-points">—</strong></div>
          <div>Player rank: <strong id="profile-player-rank">—</strong></div>
          <div>Wins–Losses–Draws: <strong id="profile-wld">—</strong></div>
        </section>
      </div>
    </div>
    
    
  </main>


  <script type="module">
    import { supabase } from "../supabase-client.js";
  
    const status = document.getElementById("profile-status");
    const content = document.getElementById("profile-content");
    const avatar = document.getElementById("profile-avatar");
    const name = document.getElementById("profile-name");
    const description = document.getElementById("profile-description");
    const topPointsDeck = document.getElementById("top-points-deck");
    const topPlayedDecks = document.getElementById("top-played-decks");
    const totalPoints = document.getElementById("profile-total-points");
    const playerRank = document.getElementById("profile-player-rank");
    const wld = document.getElementById("profile-wld");
    const defaultAvatar =
      "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' fill='%23162032'/%3E%3Ctext x='64' y='82' text-anchor='middle' font-size='64' fill='%230dcaf0'%3E%3F%3C/text%3E%3C/svg%3E";
    
    async function fetchAll(makeQuery) {
      const rows = [];
      const pageSize = 1000;
  
      for (let offset = 0; ; offset += pageSize) {
        const { data, error } = await makeQuery()
          .range(offset, offset + pageSize - 1);
  
        if (error) throw error;
        rows.push(...(data || []));
        if (!data || data.length < pageSize) return rows;
      }
    }
  
    async function fetchByIds(table, columns, ids) {
      const rows = [];
      for (let i = 0; i < ids.length; i += 100) {
        const batch = await fetchAll(() =>
          supabase.from(table).select(columns).in("id", ids.slice(i, i + 100))
        );
        rows.push(...batch);
      }
      return rows;
    }
  
    function showStatsError(message) {
      topPointsDeck.textContent = message;
      topPlayedDecks.replaceChildren();
      totalPoints.textContent = "—";
      playerRank.textContent = "—";
      wld.textContent = "—";
    }
  
    async function loadPlayerStats(userId) {
      const { data: player, error: playerError } = await supabase
        .from("players")
        .select("id, player_score")
        .eq("user_id", userId)
        .limit(1)
        .maybeSingle();
  
      if (playerError) throw playerError;
  
      if (!player) {
        showStatsError("No game player is linked to this account.");
        return;
      }
  
      const { count, error: rankError } = await supabase
        .from("players")
        .select("id", { count: "exact", head: true })
        .gt("player_score", player.player_score);
  
      if (rankError) throw rankError;
      playerRank.textContent = `#${(count || 0) + 1}`;
  
      const ownRows = await fetchAll(() =>
        supabase.from("game_players")
          .select("game_id, deck_id")
          .eq("player_id", player.id)
          .order("game_id")
      );
  
      const gameIds = [...new Set(ownRows.map(row => row.game_id))];
      if (!gameIds.length) {
        totalPoints.textContent = "0";
        wld.textContent = "0–0–0";
        topPointsDeck.textContent = "No completed games yet.";
        topPlayedDecks.replaceChildren();
        return;
      }
  
      const games = [];
      const allParticipants = [];
  
      for (let i = 0; i < gameIds.length; i += 100) {
        const ids = gameIds.slice(i, i + 100);
  
        const [gameBatch, participantBatch] = await Promise.all([
          fetchAll(() => supabase.from("games")
            .select("id, result, winner_player_id")
            .in("id", ids)),
          fetchAll(() => supabase.from("game_players")
            .select("game_id, player_id, deck_id")
            .in("game_id", ids))
        ]);
  
        games.push(...gameBatch);
        allParticipants.push(...participantBatch);
      }
  
      const gamesById = new Map(games.map(game => [game.id, game]));
      const playersPerGame = new Map();
      for (const row of allParticipants) {
        playersPerGame.set(
          row.game_id,
          (playersPerGame.get(row.game_id) || 0) + 1
        );
      }
  
      const deckIds = [...new Set(ownRows.map(row => row.deck_id).filter(Boolean))];
      const decks = await fetchByIds(
        "decks",
        "id, name, commander_id, partner_commander_id",
        deckIds
      );
  
      const commanderIds = [...new Set(
        decks.flatMap(deck => [deck.commander_id, deck.partner_commander_id])
          .filter(Boolean)
      )];
      const commanders = await fetchByIds(
        "commanders",
        "id, name, image_url, art_crop_url",
        commanderIds
      );
      
      const commandersById = new Map(commanders.map(item => [item.id, item]));
      const decksById = new Map(decks.map(deck => [deck.id, deck]));
  
      const deckStats = new Map();
      let wins = 0;
      let losses = 0;
      let draws = 0;
      let points = 0;
  
      for (const row of ownRows) {
        const game = gamesById.get(row.game_id);
        if (!game || !["win", "draw"].includes(game.result)) continue;
  
        let earned = 0;
        if (game.result === "draw") {
          draws++;
          earned = 1;
        } else if (game.winner_player_id === player.id) {
          wins++;
          earned = 1 + (playersPerGame.get(game.id) || 1);
        } else {
          losses++;
        }
  
        points += earned;
  
        if (!row.deck_id) continue;
        const stat = deckStats.get(row.deck_id) || { uses: 0, points: 0 };
        stat.uses++;
        stat.points += earned;
        deckStats.set(row.deck_id, stat);
      }
  
      totalPoints.textContent = points.toFixed(2);
      wld.textContent = `${wins}–${losses}–${draws}`;
  
      const rankedDecks = [...deckStats.entries()].map(([deckId, stat]) => {
        const deck = decksById.get(deckId);
        const commanderNames = [
          deck?.commander_id && commandersById.get(deck.commander_id)?.name,
          deck?.partner_commander_id &&
            commandersById.get(deck.partner_commander_id)?.name
        ].filter(Boolean);
  
        return {
          id: deckId,
          name: deck?.name || "Unknown deck",
          commanders: commanderNames.join(" / "),
          ...stat
        };
        
      });
  
      const bestDeck = [...rankedDecks].sort(
        (a, b) => b.points - a.points || b.uses - a.uses
      )[0];
  
      topPointsDeck.replaceChildren();
      
      if (!bestDeck) {
        topPointsDeck.innerHTML =
          '<div class="top-deck-content">No deck stats available.</div>';
      } else {
        const deck = decksById.get(bestDeck.id);
        
      
        const artPair = document.createElement("div");
        artPair.className = "commander-art-pair";
      
        const deckCommanders = [
          deck?.commander_id && commandersById.get(deck.commander_id),
          deck?.partner_commander_id && commandersById.get(deck.partner_commander_id)
        ].filter(Boolean);
      
        if (deckCommanders.length === 1) artPair.classList.add("single");
      
        for (const commander of deckCommanders) {
          const imageUrl = commander.art_crop_url || commander.image_url;
          if (!imageUrl) continue;
      
          const image = document.createElement("img");
          image.src = imageUrl;
          image.alt = `${commander.name} card art`;
          image.loading = "lazy";
          artPair.appendChild(image);
        }
      
        const details = document.createElement("div");
        details.className = "top-deck-content d-flex flex-column justify-content-center";
      
        const title = document.createElement("h3");
        title.className = "h4 fw-bold";
        title.textContent = bestDeck.name;
      
        const commanderNames = document.createElement("p");
        commanderNames.className = "mb-2";
        commanderNames.textContent = bestDeck.commanders || "Commander unavailable";
      
        const pointsText = document.createElement("strong");
        pointsText.textContent = `Average Pts: ${bestDeck.points.toFixed(2)}`;
        const uses = document.createElement("div");
        uses.className = "small";
        uses.textContent = `${bestDeck.uses} games played`;
      
        details.append(title, commanderNames, pointsText, uses);
        topPointsDeck.append(artPair, details);
      }
      topPlayedDecks.replaceChildren();
      
      const mostPlayed = [...rankedDecks]
        .sort((a, b) => b.uses - a.uses || a.name.localeCompare(b.name))
        .slice(0, 3);
      
      if (!mostPlayed.length) {
        const item = document.createElement("li");
        item.className = "list-group-item";
        item.textContent = "No deck usage recorded.";
        topPlayedDecks.appendChild(item);
      } else {
        mostPlayed.forEach(deck => {
          const item = document.createElement("li");
          item.className = "list-group-item";
          item.textContent =
            `${deck.name}${deck.commanders ? ` — ${deck.commanders}` : ""}: ` +
            `${deck.uses} games, ${deck.points.toFixed(2)} points`;
          topPlayedDecks.appendChild(item);
        });
      }
      
    }
  
    async function initialize() {
      const userId = new URLSearchParams(location.search).get("id");
      if (!userId || !/^[0-9a-f-]{36}$/i.test(userId)) {
        status.textContent = "Invalid profile link.";
        return;
      }
  
      try {
        const { data, error } = await supabase
          .from("profiles")
          .select("display_name, description, avatar_path")
          .eq("id", userId)
          .maybeSingle();
  
        if (error) throw error;
        if (!data) {
          status.textContent = "Profile not found or unavailable.";
          return;
        }
  
        name.textContent = data.display_name || "Unnamed user";
        description.textContent = data.description || "No profile description yet.";
        avatar.alt = `${name.textContent}'s profile picture`;
        avatar.src = data.avatar_path
          ? supabase.storage.from("avatars").getPublicUrl(data.avatar_path).data.publicUrl
          : defaultAvatar;
        
  
        status.classList.add("d-none");
        content.classList.remove("d-none");
  
        try {
          await loadPlayerStats(userId);
        } catch (error) {
          console.error("Could not load public profile stats:", error);
          showStatsError("Could not load game stats. Check public read access policies.");
        }
      } catch (error) {
        console.error("Could not load public profile:", error);
        status.textContent = "Could not load profile. Check Supabase configuration and RLS policies.";
      }
    }
  
    initialize();
  </script>
  
</body>
</html>
